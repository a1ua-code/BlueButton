# Local PostgreSQL database for development.
# Start it with `npm run db:up` (needs Docker Desktop running). Data is kept in the
# "pgdata" volume, so it survives restarts. `npm run db:reset` wipes and re-seeds it.
#
# Port 5433 on your computer is used (not the default 5432) so it does not clash
# with a PostgreSQL you may have installed yourself.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bluebutton
      POSTGRES_PASSWORD: bluebutton
      POSTGRES_DB: bluebutton
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bluebutton -d bluebutton"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
